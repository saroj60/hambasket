<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#84c225" />
  <link rel="icon" type="image/png" href="/pwa-icon.png" />
  <link rel="apple-touch-icon" href="/pwa-icon.png">
  <title>Aone Kirana</title>
</head>

<body>
  <div id="root"></div>
  <div id="root"></div>
  <div id="app-loading"
    style="position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:white;z-index:9999;font-family:'Outfit',sans-serif;">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&display=swap');

      .loading-image-container {
        width: 120px;
        height: 120px;
        position: relative;
        margin-bottom: 20px;
      }

      .loading-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        animation: fadeCycle 4s infinite;
      }

      .loading-img:nth-child(1) {
        animation-delay: 0s;
      }

      .loading-img:nth-child(2) {
        animation-delay: 1s;
      }

      .loading-img:nth-child(3) {
        animation-delay: 2s;
      }

      .loading-img:nth-child(4) {
        animation-delay: 3s;
      }

      @keyframes fadeCycle {
        0% {
          opacity: 0;
          transform: scale(0.9);
        }

        10% {
          opacity: 1;
          transform: scale(1);
        }

        25% {
          opacity: 1;
          transform: scale(1);
        }

        35% {
          opacity: 0;
          transform: scale(1.1);
        }

        100% {
          opacity: 0;
        }
      }

      .pulse-text {
        font-size: 1.5rem;
        font-weight: 700;
        color: #7c3aed;
        /* Brand Purple */
        animation: pulse 1.5s infinite ease-in-out;
      }

      @keyframes pulse {

        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.7;
        }
      }
    </style>

    <div class="pulse-text">Aone Kirana</div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
